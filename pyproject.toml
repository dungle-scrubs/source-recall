[project]
name = "source-recall"
version = "0.1.0"
description = "Code search and retrieval for AI coding tools"
readme = "README.md"
keywords = ["code-search", "retrieval", "tree-sitter", "embeddings", "semantic-search", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
authors = [
    { name = "Kevin", email = "dungle-scrubs@users.noreply.github.com" },
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
urls = { Homepage = "https://github.com/dungle-scrubs/source-recall", Repository = "https://github.com/dungle-scrubs/source-recall", Issues = "https://github.com/dungle-scrubs/source-recall/issues", Changelog = "https://github.com/dungle-scrubs/source-recall/blob/main/CHANGELOG.md" }
dependencies = [
    # Pinned exactly — C ABI breaks across minor versions.
    # See AGENTS.md "tree-sitter pins are exact".
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.14.3",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # L4: Pre-1.0 — vec0 virtual-table API may change.
    # Pinned exactly; monitor for 1.0 release.
    "sqlite-vec==0.1.6",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # PDF parsing surface: pymupdf parses untrusted, attacker-controlled
    # PDFs (CVE surface). Kept to a conservative major-version ceiling;
    # the exact resolved version is pinned via uv.lock, so upgrades are
    # explicit and reviewed rather than silent.
    "pymupdf>=1.24.0,<2.0.0",
    # L6: apsw bundles its own SQLite.  A major upgrade could bundle a
    # version incompatible with stdlib sqlite3 (both access the same
    # WAL file).  Pin conservatively.  apsw is required on all
    # platforms: stdlib sqlite3 is built without
    # SQLITE_ENABLE_LOAD_EXTENSION on most distros, so we use apsw's
    # extension-loading API as the load path for sqlite-vec.
    "apsw>=3.49.0.0,<4.0.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Heavy ML deps pulled only when vector search / reranking is wanted.
# FTS-only users install without the extra and avoid the ~2 GB torch
# download.  Import is lazy (see tests/test_packaging.py), so omitting
# the extra just disables vector features at runtime.
embed = [
    # L5: Minor upgrades may change embedding behavior. Stored vectors
    # could become incompatible with new query vectors.  Consider
    # storing the library version in meta for compat checking.
    "sentence-transformers>=3.0.0,<4.0.0",
    "onnxruntime>=1.18.0,<2.0.0",
    "einops>=0.8.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    # The embed extra so the test suite has access to the real
    # embedder/reranker for slow-marked tests.
    "source-recall[embed]",
]

[project.scripts]
sr = "source_recall.cli:app"

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/source_recall/cli.py" = ["B008"]  # typer uses function calls in arg defaults
"tests/*" = [
    "SIM117",  # nested with-statements are clearer than combined in arrange/act/assert tests
    "ARG001",  # unused function args match fixture/mock signatures
    "ARG002",  # unused method args match fixture/mock signatures
]

[tool.ruff.lint.isort]
known-first-party = ["source_recall"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that load ML models (deselect with '-m not slow')",
]
