version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    ignore:
      # Exact pins per AGENTS.md "tree-sitter pins are exact"; the
      # language-pack C ABI breaks across minor versions. Upgrades are
      # manual (verified chunker-wide), never Dependabot.
      - dependency-name: "tree-sitter"
      - dependency-name: "tree-sitter-language-pack"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
