name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ci / check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # Pinned by commit SHA. Bump via Dependabot; tags shown for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Pinned to the version mise.toml declares so CI matches local
          # dev exactly; uv_build requires >=0.8,<0.12.
          # tests/test_mise_config.py asserts CI/local parity.
          version: "0.11.25"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # uv sync installs the dev dependency group, which includes
        # dungle-scrubs-source-recall[embed] so slow-marked tests can
        # import sentence_transformers when they run.
        run: uv sync --frozen

      - name: Format check
        # Scoped to src/ and tests/; tests/fixtures holds intentionally
        # rough sample apps.
        run: uv run ruff format --check src/ tests/

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Type check
        # Fixtures are not first-party code and are not expected to
        # type-check.
        run: uv run ty check src tests

      - name: Test (fast)
        # Skip slow tests on every PR — they download ~500 MB of model
        # weights. test-slow below covers them on every push to main.
        run: uv run pytest -m "not slow" --tb=short

      - name: Dependency audit
        # Audit the project's resolved venv, not an ephemeral one: `uv run
        # --with pip-audit` runs inside the synced environment and sees
        # the real resolved dependency graph. `--strict` is dropped: the
        # editable dungle-scrubs-source-recall package is not on PyPI
        # yet, which --strict makes fatal. pip-audit still fails on
        # actual vulnerabilities. Add --ignore-vuln <id> only with an
        # inline justification and a drop condition.
        if: matrix.python-version == '3.13'
        run: uv run --with pip-audit pip-audit

  test-slow:
    name: Slow tests (model-loading)
    runs-on: ubuntu-latest
    # Run on every push to main. Not per-PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Pinned by commit SHA. Bump via Dependabot; tags shown for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.25"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore HuggingFace model cache
        # SHA-pinned like every other action. Key folds in embedder.py so
        # a _CODERANK_REVISION bump re-downloads instead of serving a
        # stale snapshot forever.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-coderankembed-${{ hashFiles('src/source_recall/embedder.py') }}
          restore-keys: |
            hf-${{ runner.os }}-coderankembed-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run slow tests
        run: uv run pytest -m "slow" --tb=short

  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA. Bump via Dependabot; tags shown for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.25"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # Smoke runs the FTS-only path, which is the install shape Reviewsion
        # v2 consumes. --no-default-groups skips the dev group (and with it
        # the embed extra), so this job proves the core-only install
        # resolves and works end-to-end.
        run: uv sync --frozen --no-default-groups

      - name: Smoke test
        # UV_NO_SYNC stops `uv run` inside smoke.sh from re-syncing the
        # default groups back in.
        env:
          UV_NO_SYNC: "1"
        run: ./scripts/smoke.sh
