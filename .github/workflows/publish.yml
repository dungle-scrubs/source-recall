name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, branch, or tag to publish
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  # Never cancel an in-flight publish: cancelling mid-`uv publish` can
  # abort an upload half-done (same rationale as release.yml).
  cancel-in-progress: false

jobs:
  publish:
    name: pypi / publish
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers / tag restrictions in
    # the GitHub repo settings for defense-in-depth on PyPI publishing.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned by commit SHA. Bump via Dependabot; tags shown for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Pinned to the version mise.toml declares; uv_build requires
          # >=0.8,<0.12.
          version: "0.11.25"
          python-version: "3.13"

      - name: Verify install
        # Resolve the lock and confirm the package imports + reports its
        # version before building. `uv lock` first: at a tag the committed
        # lock's project entry lags pyproject's version (release-please
        # does not update uv.lock); `uv lock` is minimum-change.
        run: |
          uv lock
          uv sync
          uv run sr --version

      - name: Test before publishing
        # Slow tests download ~500 MB of model weights; test-slow on
        # main covers them.
        run: uv run pytest -m "not slow" -q --tb=short

      - name: Build distributions
        run: uv build

      # PEP 740 provenance attestations; uv publish uploads the matching
      # `.publish.attestation` files. Pin taken from the uv GitHub guide.
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027  # v0.0.6

      - name: Publish to PyPI
        run: uv publish
