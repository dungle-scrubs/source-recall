name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight release: cancelling mid-`uv publish`
  # can abort an upload half-done.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned by commit SHA. Bump via Dependabot; tags shown for reference.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Config and manifest live at the repo root.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: pypi / publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers / tag restrictions in
    # the GitHub repo settings for defense-in-depth on PyPI publishing.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned by commit SHA. Bump via Dependabot; tags shown for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Check out the release tag, not main, so the build matches
          # the published artifact.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pinned to the version mise.toml declares; uv_build requires
          # >=0.8,<0.12.
          version: "0.11.25"
          python-version: "3.13"

      - name: Verify install
        # Resolve the lock and confirm the package imports + reports its
        # version before building. `uv lock` first: release-please bumps
        # pyproject's version but not uv.lock's project entry, so a plain
        # --frozen sync at the tag would carry a stale lock. `uv lock` is
        # minimum-change; only the project's own entry moves.
        run: |
          uv lock
          uv sync
          uv run sr --version

      - name: Test before publishing
        # Slow tests download ~500 MB of model weights; test-slow on
        # main covers them.
        run: uv run pytest -m "not slow" -q --tb=short

      - name: Build distributions
        run: uv build

      # PEP 740 provenance attestations; uv publish uploads the matching
      # `.publish.attestation` files. Pin taken from the uv GitHub guide.
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027  # v0.0.6

      - name: Publish to PyPI
        run: uv publish
